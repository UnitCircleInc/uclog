<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ucLog web</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eef0f3;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0c0f;
        }
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 12px;
        box-sizing: border-box;
      }
      uc-log {
        flex: 1;
      }
      #app-bar {
        display: flex;
        gap: 1em;
        align-items: center;
        margin: -4px 0 8px;
        font: 13px system-ui, sans-serif;
        color: #555;
      }
      #app-bar[hidden],
      #app-update[hidden] {
        display: none;
      }
      #app-bar a {
        color: inherit;
      }
      #app-update {
        margin-left: auto;
      }
      @media (prefers-color-scheme: dark) {
        #app-bar {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown by the built app on the site (main.ts); not in development or the one-file app. -->
    <nav id="app-bar" hidden>
      <a href="../">ucLog docs</a>
      <a href="uclog-app.html" download>Download for offline use</a>
      <span id="app-update" hidden>A new version is ready. <button type="button">Reload</button></span>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
