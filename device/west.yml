#
# A west workspace for working on this library with the nRF Connect SDK 2.9 (Zephyr 3.7) and
# ucComm:
#   west init -m https://github.com/UnitCircleInc/uclog-device ws && cd ws && west update
# A project that uses the library adds it (and ucComm, or it uses the copy in uccomm/) to its own
# west.yml instead.

manifest:
  self:
    path: uclog-device

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: uci
      url-base: https://github.com/UnitCircleInc

  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v2.9.0
      import:
        name-allowlist:
          - zephyr
          - nrfxlib
          - cmock
          - cmsis
          - hal_nordic
          - segger
          - tinycrypt

    - name: uccomm
      remote: uci
      revision: v6 # the same as uccomm/
      repo-path: ucComm
      path: modules/uccomm
