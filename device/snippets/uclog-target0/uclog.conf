# ucLog, with Zephyr's LOG_INF() and friends as ucLog logs (LOG_CUSTOM_HEADER): Zephyr's own log
# core, backends and console are left out.
CONFIG_UC_LOG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_CUSTOM_HEADER=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Board defaults (the nRF52840-DK's) that would log or print elsewhere.
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_BACKEND_RTT=n
