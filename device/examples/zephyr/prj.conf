# ucLog on the devicetree's uclog,link (boards/*.overlay).
CONFIG_UC_LOG=y
# Zephyr's LOG_INF() and friends become ucLog logs; no Zephyr log backends or console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_CUSTOM_HEADER=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

# The example's LED.
CONFIG_GPIO=y
