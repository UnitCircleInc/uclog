[package]
name = "uclog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["gui"]
# `uclog gui` (egui). Without it: the CLI, TUI and hub only, with no windowing dependencies.
gui = ["dep:eframe", "dep:egui", "dep:egui_dock", "dep:egui_extras", "dep:egui_plot", "dep:image", "dep:rfd", "dep:vte"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.5.61", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-lite = "2.6.1"
hex = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uclog-hub = { version = "0.1.0", path = "../uclog-hub" }
uclog-link = { version = "0.1.0", path = "../uclog-link" }
uclog-logdata = { version = "0.1.0", path = "../uclog-logdata" }
uclog-proto = { version = "0.1.0", path = "../uclog-proto" }
uclog-semihost = { version = "0.1.0", path = "../uclog-semihost" }
uclog-session = { version = "0.1.0", path = "../uclog-session" }

eframe = { version = "0.36.2", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence", "accesskit"] }
egui = { version = "0.36.2", optional = true }
egui_dock = { version = "0.21.1", optional = true, features = ["serde"] }
egui_extras = { version = "0.36.2", optional = true }
egui_plot = { version = "0.37.0", optional = true }
image = { version = "0.25.9", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }
vte = { version = "0.15.0", optional = true }

[dev-dependencies]
egui_kittest = "0.36.2"
tempfile = "3.27.0"
