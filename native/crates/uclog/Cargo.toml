[package]
name = "uclog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-lite = "2.6.1"
hex = "0.4.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uclog-link = { version = "0.1.0", path = "../uclog-link" }
uclog-logdata = { version = "0.1.0", path = "../uclog-logdata" }
uclog-proto = { version = "0.1.0", path = "../uclog-proto" }
uclog-semihost = { version = "0.1.0", path = "../uclog-semihost" }
uclog-session = { version = "0.1.0", path = "../uclog-session" }

[dev-dependencies]
tempfile = "3.27.0"
