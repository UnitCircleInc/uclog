[package]
name = "uclog-hub"
description = "ucLog hub: one device shared with one TCP/WebSocket/UDP client at a time"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "uclog-hub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.34"
gethostname = "1.0.2"
mdns-sd = "0.21.6"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12", "aws_lc_rs"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uclog-link = { version = "0.1.0", path = "../uclog-link" }
uclog-proto = { version = "0.1.0", path = "../uclog-proto" }
uclog-semihost = { version = "0.1.0", path = "../uclog-semihost" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
rcgen = "0.14.5"
tempfile = "3.27.0"
