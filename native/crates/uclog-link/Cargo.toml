[package]
name = "uclog-link"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
btleplug = "0.13.5"
futures = "0.3.34"
hidapi = "2.6.7"
mdns-sd = "0.21.6"
serialport = "4.10.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
uclog-proto = { version = "0.1.0", path = "../uclog-proto" }
uuid = "1.20.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }
