# The Python library (plan 06): unit tests, spec/vectors, and integration tests against a real
# uclog-hub with the loopback device.
name: python

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Linux build dependencies (hidapi, btleplug)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build uclog-hub
        working-directory: native
        run: cargo build --locked -p uclog-hub
      - name: Test
        working-directory: python
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -v -W error::ResourceWarning
