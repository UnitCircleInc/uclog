# The web version (plan 02) and the VS Code extension (plan 03): type check, unit tests with
# spec/vectors, the <uc-log> bundles, Playwright end-to-end tests in Chromium (including the native
# hub over WebSocket), and the extension in a real VS Code (Playwright's Electron driver, xvfb).
name: web

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Linux build dependencies (hidapi, btleplug)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build uclog-hub (for the hub end-to-end test)
        working-directory: native
        run: cargo build --locked -p uclog-hub
      - name: Install
        run: npx -y pnpm@12.10.1 install --frozen-lockfile
      - name: Type check
        run: |
          npx tsc -p tsconfig.json
          npx tsc -p apps/vscode/tsconfig.json
      - name: Unit tests
        run: npx vitest run
      - name: Build the element bundles
        working-directory: web/packages/element
        run: npx vite build && npx vite build --mode iife && npx vite build --mode workers
      - name: End-to-end tests
        env:
          UCLOG_E2E_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Build the VS Code extension (with this build's uclog-hub)
        working-directory: web/apps/vscode
        run: |
          npx vite build --mode host && npx vite build
          node scripts/package.mjs --local --no-package
      - name: VS Code end-to-end tests
        env:
          VSCODE_VERSION: 1.133.0
        run: |
          curl -fsSL -o /tmp/vscode.tar.gz "https://update.code.visualstudio.com/${VSCODE_VERSION}/linux-x64/stable"
          mkdir -p /tmp/vscode && tar xzf /tmp/vscode.tar.gz -C /tmp/vscode --strip-components 1
          sudo apt-get install -y xvfb
          UCLOG_VSCODE=/tmp/vscode/code xvfb-run -a npx playwright test -c apps/vscode/playwright.config.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: |
            web/test-results
            web/apps/vscode/test-results
