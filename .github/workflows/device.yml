# The device library (plan 08 task 6): the host build against spec/vectors, the bare-metal example
# and test firmware, and Zephyr builds (3.7 LTS and current), with the repository root as the
# Zephyr module.
name: device

on:
  push:
    paths:
      - device/**
      - firmware/**
      - spec/**
      - zephyr/**
      - .github/workflows/device.yml
      - .github/scripts/fetch-stm32cube.sh
      - .github/scripts/zephyr-builds.sh
      - .github/zephyr/**
  pull_request:
    paths:
      - device/**
      - firmware/**
      - spec/**
      - zephyr/**
      - .github/workflows/device.yml
      - .github/scripts/fetch-stm32cube.sh
      - .github/scripts/zephyr-builds.sh
      - .github/zephyr/**
  workflow_dispatch:

jobs:
  # The encoder and the RX scanner against spec/vectors and the reference (device/test/host), on
  # x86-64 and Arm64.
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S device/test/host -B build/host && cmake --build build/host
      - run: python3 device/test/host/test_vectors.py build/host/uclog_host_test -v
      - run: python3 -I -m unittest discover -s device/tools -v

  # The bare-metal example (device/examples/baremetal, with make and with CMake) and the test
  # firmware for the three STM32 boards (firmware/README.md), against the STM32Cube parts they use
  # (ST's code is not in this repository).
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: STM32Cube
        run: |
          f=.github/scripts/fetch-stm32cube.sh
          $f STM32CubeL4 v1.18.2 cube/l4 Drivers/CMSIS/Include \
            -- Drivers/STM32L4xx_HAL_Driver Drivers/CMSIS/Device/ST/STM32L4xx
          $f STM32CubeC0 v1.4.1 cube/c0 Drivers/CMSIS/Include \
            -- Drivers/STM32C0xx_HAL_Driver Drivers/CMSIS/Device/ST/STM32C0xx
          $f STM32CubeWBA v1.10.0 cube/wba Drivers/CMSIS/Include \
            Projects/NUCLEO-WBA55CG/Applications/BLE/BLE_p2pServer_Simplest \
            -- Drivers/STM32WBAxx_HAL_Driver Drivers/CMSIS/Device/ST/STM32WBAxx Middlewares/ST/STM32_WPAN
      - name: Example
        run: |
          make -C device/examples/baremetal STM32CUBE_L4=$PWD/cube/l4
          cmake -S device/examples/baremetal -B build/example-cmake \
            -DCMAKE_TOOLCHAIN_FILE=cortex-m4f.cmake -DSTM32CUBE_L4=$PWD/cube/l4
          cmake --build build/example-cmake
      - name: Build
        run: |
          make -C firmware/nucleo-l452re-p STM32CUBE_L4=$PWD/cube/l4
          make -C firmware/nucleo-c071rb STM32CUBE_C0=$PWD/cube/c0
          make -C firmware/stm32wba55g-dk1 STM32CUBE_WBA=$PWD/cube/wba
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: test-firmware
          path: |
            firmware/*/build/app.elf
            firmware/*/build/app.bin

  # .github/scripts/zephyr-builds.sh: the example (device/examples/zephyr) on the NUCLEO-L452RE-P
  # and the nRF52840-DK with each driver and every option, and the test firmware (firmware/zephyr, Zephyr 4).
  # Each Zephyr version in the CI image with the SDK it was released with.
  zephyr:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { zephyr: v3.7.2, image: "ghcr.io/zephyrproject-rtos/ci:v0.26.18" } # SDK 0.16.9
          - { zephyr: v4.4.2, image: "ghcr.io/zephyrproject-rtos/ci:v0.29.4" }  # SDK 1.0.x
    runs-on: ubuntu-24.04
    # The CI image (all of Zephyr's toolchains) is bigger than a runner's free disk, so space is
    # made first and the image runs with docker run (a job container is pulled before any step).
    steps:
      - name: Disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af
          df -h /
      - uses: actions/checkout@v5
        with:
          path: uclog
      - uses: actions/cache@v5
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/.west
          key: zephyr-${{ matrix.zephyr }}-${{ hashFiles(format('uclog/.github/zephyr/{0}/west.yml', matrix.zephyr)) }}
      - name: Pull ${{ matrix.image }}
        run: docker pull -q ${{ matrix.image }}
      - name: Workspace and build
        run: |
          mkdir -p ws/manifest
          cp uclog/.github/zephyr/${{ matrix.zephyr }}/west.yml ws/manifest/
          docker run --rm -v "$PWD:/w" -w /w/ws ${{ matrix.image }} bash -ec '
            git config --global --add safe.directory "*"
            [ -d .west ] || west init -l manifest
            west update --narrow -o=--depth=1
            ZEPHYR_BASE=$PWD/zephyr ../uclog/.github/scripts/zephyr-builds.sh ../build'
