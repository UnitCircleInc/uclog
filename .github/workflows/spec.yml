name: spec

on:
  push:
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Vectors are up to date
        run: python3 -I spec/reference/gen_vectors.py --check
      - name: Vectors pass against the reference
        run: python3 -I spec/reference/check_vectors.py

  # Versions (plan 08 §2.2a): the manifests agree with each other, and the SoloVer mapping holds.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -I -m unittest discover -s scripts
      - run: python3 -I scripts/version.py show
