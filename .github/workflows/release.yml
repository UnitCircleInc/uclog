# Release builds of `uclog` and `uclog-hub` (hub plan §9, task 10).
#
# On a tag v*: build every target, package, checksum, and attach to a draft GitHub release. Also
# build the Python wheels (with uclog-hub bundled) as an artifact.
# The macOS files are signed and notarised in the macos job (with the secrets below). Not yet
# done: Windows signing. See docs/plans/07-release.md.
#
# Artifacts: dist-* are the release's files (the release job attaches them all); unsigned-* are
# the macOS builds before the macos job signs them.
#
# Until there is a GitHub remote, .github/act-release.sh runs this workflow locally with act
# (Linux jobs in Docker, macOS rows on this Mac, no Windows rows, no release job).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: native

jobs:
  # The tag (vN, plan 08 §2.2a) must match every manifest: scripts/version.py set N, commit, tag.
  version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -I scripts/version.py check "$GITHUB_REF_NAME"
      - name: Manifests agree
        run: python3 -I scripts/version.py show

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          # The Raspberry Pi's 32-bit OS, cross-compiled with Ubuntu's armhf toolchain and libraries
          # (glibc 2.35, as the other Linux builds: Raspberry Pi OS bookworm and later).
          - { os: ubuntu-22.04, target: armv7-unknown-linux-gnueabihf, name: linux-armv7, armhf: true }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, name: macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux' && !matrix.armhf
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - name: armhf toolchain and libraries
        if: matrix.armhf
        run: |
          set -euo pipefail
          # armhf packages come from ports.ubuntu.com; the runner's mirror is for amd64 only.
          sudo dpkg --add-architecture armhf
          sudo sed -i -E 's/^deb (http|mirror)/deb [arch=amd64] \1/' /etc/apt/sources.list
          for s in jammy jammy-updates jammy-security; do
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $s main universe"
          done | sudo tee /etc/apt/sources.list.d/armhf.list
          sudo apt-get update
          sudo apt-get install -y pkg-config gcc-arm-linux-gnueabihf libudev-dev:armhf libdbus-1-dev:armhf
          {
            echo CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
            echo CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
            echo PKG_CONFIG_ALLOW_CROSS=1
            echo PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          } >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p uclog -p uclog-hub
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="uclog-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$out"
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/uclog$ext" "target/${{ matrix.target }}/release/uclog-hub$ext" "dist/$out/"
          cp ../LICENSE README.md "dist/$out/"
          [[ "${{ runner.os }}" == "Linux" ]] && cp packaging/linux/70-uclog.rules "dist/$out/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$out.zip" "$out" > /dev/null
            sha256sum "$out.zip" > "$out.zip.sha256"
          else
            tar czf "$out.tar.gz" "$out"
            shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'macOS' && 'unsigned' || 'dist' }}-${{ matrix.name }}
          path: |
            native/dist/*.tar.gz*
            native/dist/*.zip*

  # macOS (plan 07 tasks 4 and 5): sign and notarise uclog and uclog-hub, and ucLog.app (universal)
  # in a .dmg: packaging/macos/release.sh. Secrets: MACOS_CERTIFICATE_P12 (the Developer ID
  # Application certificate and key, .p12 in base64), MACOS_CERTIFICATE_PASSWORD, and an App Store
  # Connect API key for notarytool: APPLE_API_KEY_P8 (the .p8 file's text), APPLE_API_KEY_ID,
  # APPLE_API_ISSUER_ID. Without them the archives go on unsigned, with no .dmg.
  macos:
    needs: build
    runs-on: macos-14
    defaults:
      run:
        working-directory: .
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-macos-*
          path: unsigned
          merge-multiple: true
      - name: Sign and notarise
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          signed=0
          if [[ -n $CERT_P12 && -n $NOTARY_KEY_P8 ]]; then
            # A keychain for this job only, holding the certificate, that codesign may use unprompted.
            kc=$RUNNER_TEMP/signing.keychain-db
            kp=$(openssl rand -hex 16)
            security create-keychain -p "$kp" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kp" "$kc"
            printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
            export MACOS_SIGN_IDENTITY
            printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY=$RUNNER_TEMP/notary.p8 NOTARY_KEY_ID NOTARY_ISSUER
            signed=1
          else
            echo "::warning::no MACOS_CERTIFICATE_P12 or APPLE_API_KEY_P8 secret: the macOS files are not signed"
          fi
          native/packaging/macos/release.sh "$tag" "unsigned/uclog-$tag-macos-arm64.tar.gz" \
            "unsigned/uclog-$tag-macos-x64.tar.gz" dist
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  # Python wheels (plan 06 §2): one per platform with uclog-hub bundled, plus py3-none-any and
  # the sdist. They are attached to the draft release, and published by the pypi jobs below.
  wheels:
    needs: [build, macos]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Build wheels
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob  # an unmatched pattern expands to nothing (each OS has one archive type)
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
          for pair in linux-x64:manylinux_2_35_x86_64 linux-arm64:manylinux_2_35_aarch64 linux-armv7:manylinux_2_35_armv7l \
                      macos-arm64:macosx_11_0_arm64 macos-x64:macosx_10_12_x86_64 \
                      windows-x64:win_amd64 windows-arm64:win_arm64; do
            name=${pair%%:*}; plat=${pair#*:}
            dir="unpacked/$name"; mkdir -p "$dir"
            archives=(../artifacts/uclog-*-"$name".tar.gz ../artifacts/uclog-*-"$name".zip)
            if (( ${#archives[@]} == 0 )) && [[ -n "${ACT:-}" ]]; then
              echo "::warning::act: no archive for $name, skipped"; continue
            fi
            if (( ${#archives[@]} != 1 )); then
              echo "::error::expected one archive for $name, found ${#archives[@]}: ${archives[*]}"
              exit 1
            fi
            archive=${archives[0]}
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$dir" ;;
              *) tar xzf "$archive" -C "$dir" ;;
            esac
            hub=$(find "$dir" -type f \( -name 'uclog-hub' -o -name 'uclog-hub.exe' \) -print -quit)
            [[ -n "$hub" ]] || { echo "::error::no uclog-hub in $archive"; exit 1; }
            rm -rf build
            UCLOG_HUB_BINARY="$PWD/$hub" UCLOG_WHEEL_PLAT="$plat" python -m build --wheel --outdir dist
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: python/dist/*

  # The VS Code extension (plan 03 §6): one VSIX with every target's uclog-hub from the archives
  # above (checksums verified). Publishing to the Marketplace and Open VSX: plan 07.
  vsix:
    needs: [build, macos]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Build and package
        run: |
          npx -y pnpm@12.10.1 install --frozen-lockfile
          cd apps/vscode
          npx vite build --mode host && npx vite build
          node scripts/package.mjs --from ../../../artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vsix
          path: web/apps/vscode/*.vsix

  # The site's parts of this release (plan 08 §3): the docs as uclog-docs-N.tar.gz (the Pages
  # deploy unpacks every release's at /vN/), the one-file web app uclog-app-N.html, and <uc-log> as
  # one script, uclog-element-N.iife.js.
  site:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags: the docs' Releases page
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}; [[ $tag == v* ]] || tag=dev   # workflow_dispatch: not a release
          n=${tag#v}
          (cd web && npx -y pnpm@12.10.1 install --frozen-lockfile && npx -y pnpm@12.10.1 --filter @uclog/element build \
            && cd apps/demo && npx vite build --mode single)
          uv run --project website python website/build.py docs "$tag" "build/$tag"
          mkdir -p dist
          tar czf "dist/uclog-docs-$n.tar.gz" -C build "$tag"
          cp web/apps/demo/dist-single/uclog-app.html "dist/uclog-app-$n.html"
          cp web/packages/element/dist/uclog-element.iife.js "dist/uclog-element-$n.iife.js"
          (cd dist && sha256sum * > "uclog-site-$n.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-site
          path: dist/*

  release:
    needs: [build, macos, wheels, vsix, site]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the previous release's tag: the notes' changes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The notes, and uclog-release-N.json for the download page: the files with their SHA-256, the
      # versions in the release, and the signing status (Windows: plan 07 task 6 will set
      # UCLOG_SIGNED_WINDOWS).
      - name: Notes and manifest
        env:
          UCLOG_SIGNED_MACOS: ${{ needs.macos.outputs.signed }}
        run: |
          set -euo pipefail
          n=${GITHUB_REF_NAME#v}
          python3 -I scripts/releases.py notes "$GITHUB_REF_NAME" > notes.md
          python3 -I scripts/releases.py manifest "$GITHUB_REF_NAME" dist > "dist/uclog-release-$n.json"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=(); [[ $GITHUB_REF_NAME =~ -(alpha|beta|rc)[1-9]$ ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --notes-file notes.md "${pre[@]}"

  # Publishing (plan 07 tasks 12, 13a and 13b), on a tag, once the draft release has everything.
  # Each job waits in its environment for a reviewer's approval (Settings → Environments), so
  # nothing is published unseen. Only from UnitCircleInc/uclog (not a fork or a staging copy). docs/plans/08-go-public.md has the accounts and secrets.

  # PyPI by trusted publishing (no token): TestPyPI first, then an install from it on three OSs
  # (the wheel's own uclog-hub, against the simulated device), then PyPI.
  testpypi:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'UnitCircleInc/uclog'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-install:
    needs: testpypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install from TestPyPI and connect to the simulated device
        shell: bash
        run: |
          set -euo pipefail
          v=$(python3 -I scripts/version.py map "${GITHUB_REF_NAME#v}" | python3 -I -c 'import json, sys; print(json.load(sys.stdin)["pypi"])')
          for i in 1 2 3 4 5 6; do  # the index can take a minute to show a new release
            python -m pip install --no-cache-dir --index-url https://test.pypi.org/simple/ "uclog==$v" && break
            sleep 20
          done
          cd "$RUNNER_TEMP"  # not the checkout: the installed package
          python - <<'PY'
          import uclog, uclog.hub
          exe = uclog.hub.find_executable()
          assert exe and 'site-packages' in exe, exe  # the wheel's own uclog-hub
          with uclog.connect(device='loopback:rate=0') as dev:
              info = dev.command({'cmd': 'get-info'})
          assert info['board'] == 'loopback', info
          print('ok', uclog.__version__, exe)
          PY

  pypi:
    needs: testpypi-install
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # npm: @uclog/element with provenance. pnpm pack writes the package as published (no workspace:
  # versions); npm publishes it, by trusted publishing once the package has one, else with
  # NPM_TOKEN (the first publish). Pre-releases go to the `next` dist-tag.
  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'UnitCircleInc/uclog'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npx -y pnpm@12.10.1 install --frozen-lockfile
          npx -y pnpm@12.10.1 --filter @uclog/element build
          cd packages/element
          npx -y pnpm@12.10.1 pack --pack-destination "$RUNNER_TEMP"
          tag=latest; [[ $GITHUB_REF_NAME == *-* ]] && tag=next
          npx -y npm@11.6.2 publish "$RUNNER_TEMP"/uclog-element-*.tgz --provenance --access public --tag "$tag"

  # VS Code: the release's VSIX to the Marketplace and Open VSX. Not pre-releases: the Marketplace
  # takes no pre-release version (plan 08 §2.2a); their VSIX is on the GitHub release only.
  vscode:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && github.repository == 'UnitCircleInc/uclog'
    runs-on: ubuntu-latest
    environment: vscode
    # Both by trusted publishing (OIDC): no tokens.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist-vsix
          path: vsix
      - name: Publish
        working-directory: .
        run: |
          set -euo pipefail
          f=$(ls vsix/*.vsix)
          npx -y @vscode/vsce@4.0.0 publish --packagePath "$f" --oidc
          npx -y ovsx@1.2.0 publish "$f" --trusted-publishing --skip-duplicate
