# A minimal Zephyr v3.7.2 workspace for the device CI (.github/workflows/device.yml): the ucLog
# repository is added with ZEPHYR_EXTRA_MODULES, and uses its own copy of ucComm (device/uccomm).
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v3.7.2
      import:
        name-allowlist:
          - cmsis
          - hal_stm32
          - hal_nordic
  self:
    path: manifest
