# ucLog on the devicetree's uclog,link (boards/*.overlay), with semihost.
CONFIG_UC_LOG=y
CONFIG_UC_SYSCALLS=y
# Zephyr's LOG_INF and friends as ucLog logs; no Zephyr log backends or console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_CUSTOM_HEADER=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

# The test app: printf with floats, POSIX files (on the semihost file system), the LED, the UID.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_POSIX_API=y
# File descriptors: stdin, stdout, stderr and the selftest's files.
CONFIG_ZVFS_OPEN_ADD_SIZE_POSIX=8
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=4096
